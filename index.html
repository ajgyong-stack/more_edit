<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:#fff}
  body{display:flex;align-items:center;justify-content:center}

  .phone{position:relative;--kbh:262px;width:390px;height:844px;max-height:100vh;background:#000;overflow:hidden;border-radius:44px;box-shadow:0 0 0 8px #222,0 20px 60px rgba(0,0,0,.6)}
  @media (max-width:500px){.phone{width:100vw;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}

  /* 상태바 */
  .status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font-weight:600;font-size:16px;z-index:30;pointer-events:none}
  .status .r{display:flex;align-items:center;gap:6px;font-size:13px}
  .bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
  .bars i{display:block;width:3px;background:#fff;border-radius:1px}
  .batt{width:25px;height:12px;border-radius:4px;background:#fff;position:relative}
  .batt:after{content:"";position:absolute;right:-3px;top:4px;width:2px;height:4px;background:#888;border-radius:0 2px 2px 0}

  /* 헤더 */
  .header{position:absolute;top:0;left:0;right:0;height:132px;z-index:20;background:linear-gradient(#000 40%,rgba(0,0,0,0));padding-top:50px}
  .hbtn{position:absolute;top:56px;height:44px;border-radius:22px;background:rgba(40,40,44,.85);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08)}
  .back{left:14px;min-width:74px;gap:4px;padding:0 8px 0 10px}
  .back .badge{background:#fff;color:#000;font-size:14px;font-weight:600;border-radius:12px;padding:1px 8px}
  .video{right:14px;width:48px}
  .contact{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(#7d6ba8,#4d3f78);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600}
  .namepill{margin-top:-6px;background:rgba(50,50,54,.9);backdrop-filter:blur(20px);border-radius:16px;padding:3px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.08)}
  .namepill small{color:#999;font-size:11px}

  /* 메시지 영역 */
  .chat{position:absolute;inset:0;overflow-y:auto;padding:130px 12px 90px;display:flex;flex-direction:column;scrollbar-width:none;transition:padding-bottom .38s cubic-bezier(.2,.8,.2,1)}
  .chat::-webkit-scrollbar{display:none}
  .kb-on .chat{padding-bottom:calc(90px + var(--kbh))}
  .date{align-self:center;text-align:center;color:#8e8e93;font-size:12px;margin:14px 0 8px;line-height:1.35}
  .date b{font-weight:600}
  .row{display:flex;margin-top:3px;animation:pop .22s ease-out}
  .row.me{justify-content:flex-end}
  .row.gap{margin-top:12px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

  .bubble{position:relative;max-width:75%;padding:9px 15px;border-radius:20px;font-size:17px;line-height:1.28;word-break:break-word;white-space:pre-wrap}
  .me .bubble{background:#2f95ff;color:#fff}
  .them .bubble{background:#262629;color:#fff}
  .tail:before,.tail:after{content:"";position:absolute;bottom:0;height:20px}
  .me .tail:before{right:-7px;width:20px;background:#2f95ff;border-bottom-left-radius:16px 14px}
  .me .tail:after{right:-26px;width:26px;background:#000;border-bottom-left-radius:10px}
  .them .tail:before{left:-7px;width:20px;background:#262629;border-bottom-right-radius:16px 14px}
  .them .tail:after{left:-26px;width:26px;background:#000;border-bottom-right-radius:10px}

  .receipt{align-self:flex-end;font-size:11px;color:#8e8e93;margin:3px 4px 0;animation:fade .35s ease-out}
  .receipt b{font-weight:600}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .system{align-self:center;text-align:center;color:#8e8e93;font-size:12px;margin:14px 0 4px;line-height:1.35}

  /* 입력중 */
  .dots{display:flex;gap:4px;padding:6px 2px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* 입력창 */
  .composer{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 28px;display:flex;align-items:center;gap:8px;z-index:20;background:linear-gradient(rgba(0,0,0,0),#000 40%);transition:bottom .38s cubic-bezier(.2,.8,.2,1),padding .38s cubic-bezier(.2,.8,.2,1)}
  .plus{flex:none;width:40px;height:40px;border-radius:50%;background:#2a2a2d;display:flex;align-items:center;justify-content:center}
  .field{flex:1;height:42px;border-radius:21px;border:1px solid #3a3a3d;background:#0c0c0d;display:flex;align-items:center;padding:0 6px 0 16px}
  .field input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:17px;font-family:inherit;min-width:0}
  .field input::placeholder{color:#6d6d72}
  .mic,.send{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .send{background:#2f95ff;border-radius:50%;display:none;cursor:pointer}
  .field.typing .mic{display:none}.field.typing .send{display:flex}

  /* 키보드 */
  .field input{caret-color:#2f95ff}
  .send{transition:transform .1s}
  .send.press{transform:scale(.8)}
  .kb-on .composer{bottom:var(--kbh);padding-bottom:8px}
  .kb{position:absolute;left:0;right:0;bottom:0;height:var(--kbh);z-index:25;background:#1c1c1e;padding:10px 3px 0;display:flex;flex-direction:column;gap:11px;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);user-select:none;pointer-events:none}
  .kb-on .kb{transform:none}
  .kr{display:flex;gap:6px}
  .kr.r2{padding:0 19px}
  .k{flex:1;min-width:0;height:42px;border-radius:5px;background:#6b6b6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.45)}
  .k.fn{background:#47474a;font-size:15px}
  .k.hit{background:#8a8a8e}
  .k.fn.hit{background:#6b6b6e}
  .k.on{background:#fff;color:#000}
  .k.on svg{stroke:#000;fill:#000}
  .k.l.hit::after{content:attr(data-k);position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);width:150%;height:58px;border-radius:9px;background:#8a8a8e;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5}
  .kb .bt{display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:40px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span id="clock">9:14</span>
    <span class="r">
      <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
      <b>5G</b><span class="batt"></span>
    </span>
  </div>

  <div class="header">
    <div class="hbtn back">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>
      <span class="badge" id="badge">902</span>
    </div>
    <div class="contact" id="contact" title="클릭하면 처음부터 다시 재생">
      <div class="avatar" id="avatar">김</div>
      <div class="namepill"><span id="name">김채원</span><small>〉</small></div>
    </div>
    <div class="hbtn video">
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><rect x="2" y="3" width="17" height="16" rx="4"/><path d="M19 9l7-4.5v13L19 13"/></svg>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="composer">
    <div class="plus"><svg width="20" height="20" viewBox="0 0 20 20" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M10 2v16M2 10h16"/></svg></div>
    <div class="field" id="field">
      <input id="input" placeholder="iMessage" autocomplete="off" inputmode="none">
      <span class="mic"><svg width="18" height="24" viewBox="0 0 18 24" fill="none" stroke="#6d6d72" stroke-width="2" stroke-linecap="round"><rect x="5" y="1" width="8" height="14" rx="4"/><path d="M1.5 11a7.5 7.5 0 0015 0M9 19v4"/></svg></span>
      <span class="send" id="sendBtn"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V2M2 7l5-5 5 5"/></svg></span>
    </div>
  </div>

  <div class="kb" id="kb"></div>
</div>

<script>
/* ================== ✏️ 여기만 수정하세요 ================== */
const CONFIG = {
  name: "김지우엉🥔<◡>", // 상대방 이름
  initial: "김",       // 프로필 동그라미 글자 (비우면 이름 첫 글자)
  badge: 902,          // 뒤로가기 옆 안 읽은 메시지 수 (0이면 숨김)
  time: "9:14",        // 상태바 시간 (비우면 현재 시각)
  autoplay: true,      // 열자마자 자동 재생
  delivered: "전달됨", // 보낸 직후 표시 ("" 이면 숨김)
  readText: "읽음",    // 상대가 읽었을 때 표시
  readTime: "오후 9:15", // 읽음 옆 시각 (비우면 현재 시각 자동)
  readDelay: 1000,     // 내가 보낸 뒤 "전달됨" → "읽음" 으로 바뀌기까지 시간(ms). -1 이면 자동 읽음 끔
  keyboard: true,      // 하단 키보드 + 타자 치는 연출 (false 면 끔)
  typeSpeed: 70,       // 자판 하나 누르는 평균 간격(ms). 작을수록 빠르게 침
};

/*  from : "me"(파란색, 내가 보냄) | "them"(회색, 상대가 보냄)
    text : 메시지 내용
    wait : 타자 치기 시작하기 전 대기(ms)  (them 은 입력중 "..." 뜨기 전 대기)
    typing: (them 전용) 입력중 "..." 보여주는 시간(ms)
    { date: "..." }   → 날짜/시간 구분선
    { system: "..." } → 가운데 작은 안내문 (줄바꿈은 \n)
    { read: 2000 }    → 2초 뒤 마지막 내 메시지 아래 "전달됨" → "읽음 오후 9:15" 로 바뀜
    { pause: 3500 }   → 3.5초 쉬기                                          */
const SCRIPT = [
  { date: "<b>오늘</b> 오후 9:14" },
  { from: "me", text: "언니",                 wait: 600 },
  { from: "me", text: "어제 술 마시고 나한테 한 말", wait: 500 },
  { from: "me", text: "기억 안나요?",         wait: 500 },
  { pause: 3500 },         // 잠깐 쉬고
  { from: "me", text: "야",                 wait: 500 },
  { from: "me", text: "김지우",              wait: 500 },
  { from: "me", text: "또 읽씹하지",         wait: 500 },
];
/* ========================================================== */

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), field = $("field");
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0, lastRow = null, receiptEl = null;

// 헤더 / 시계
$("name").textContent = CONFIG.name;
$("avatar").textContent = CONFIG.initial || [...CONFIG.name][0] || "?";
CONFIG.badge > 0 ? $("badge").textContent = CONFIG.badge : $("badge").style.display = "none";
const tickClock = () => $("clock").textContent = CONFIG.time || new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:false}).replace(/^24/,"0");
tickClock(); if(!CONFIG.time) setInterval(tickClock, 10000);

const scrollDown = () => chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });

function clearReceipt(){ if(receiptEl){ receiptEl.remove(); receiptEl = null; } }

function addBubble(from, text){
  const sameGroup = lastRow && lastRow.dataset.from === from;
  if(sameGroup) lastRow.querySelector(".bubble").classList.remove("tail");
  if(from === "them") clearReceipt();
  const row = document.createElement("div");
  row.className = `row ${from}` + (sameGroup ? "" : " gap");
  row.dataset.from = from;
  const b = document.createElement("div");
  b.className = "bubble tail";
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  lastRow = row;
  if(from === "me") showReceipt();
  scrollDown();
  return row;
}

function showReceipt(){
  clearReceipt();
  if(!CONFIG.delivered) return;
  receiptEl = document.createElement("div");
  receiptEl.className = "receipt";
  receiptEl.textContent = CONFIG.delivered;
  chat.appendChild(receiptEl);
}

function nowLabel(){
  const d = new Date(), h = d.getHours();
  return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function setRead(){
  if(!receiptEl) return;
  const el = receiptEl;
  el.innerHTML = `<b>${CONFIG.readText}</b> ${CONFIG.readTime || nowLabel()}`;
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  scrollDown();
}

function addNote(cls, html){
  const d = document.createElement("div");
  d.className = cls; d.innerHTML = html.replace(/\n/g,"<br>");
  chat.appendChild(d); lastRow = null; scrollDown();
}

function showTyping(){
  clearReceipt();
  const sameGroup = lastRow && lastRow.dataset.from === "them";
  const row = document.createElement("div");
  row.className = "row them" + (sameGroup ? "" : " gap");
  row.innerHTML = '<div class="bubble tail"><div class="dots"><i></i><i></i><i></i></div></div>';
  chat.appendChild(row); scrollDown();
  return row;
}

/* ---------- 가상 키보드 + 타자 연출 ---------- */
const phone = document.querySelector(".phone");
const sendEl = $("sendBtn");
const ROWS = ["ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ", "ㅁㄴㅇㄹㅎㅗㅓㅏㅣ", "ㅋㅌㅊㅍㅠㅜㅡ"];
const SHIFT_MAP = {"ㅂ":"ㅃ","ㅈ":"ㅉ","ㄷ":"ㄸ","ㄱ":"ㄲ","ㅅ":"ㅆ","ㅐ":"ㅒ","ㅔ":"ㅖ"};
const UNSHIFT = Object.fromEntries(Object.entries(SHIFT_MAP).map(([a, b]) => [b, a]));
const keyEls = {};
let shiftEl, spaceEl, numEl, kbOn = false;

(function buildKb(){
  const kb = $("kb");
  const mk = (cls, html, flex) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; if(flex) d.style.flex = flex; return d; };
  const letterRow = (chars, cls) => {
    const r = mk("kr " + (cls || ""), "");
    [...chars].forEach(c => { const k = mk("k l", c); k.dataset.k = c; keyEls[c] = k; r.appendChild(k); });
    return r;
  };
  kb.appendChild(letterRow(ROWS[0]));
  kb.appendChild(letterRow(ROWS[1], "r2"));
  const r3 = letterRow(ROWS[2]);
  shiftEl = mk("k fn", '<svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M11 2L2 11h5v7h8v-7h5z"/></svg>', "1.576");
  r3.prepend(shiftEl);
  r3.appendChild(mk("k fn", '<svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 2h14a2 2 0 012 2v12a2 2 0 01-2 2H8L1 10z"/><path d="M12 7l6 6M18 7l-6 6"/></svg>', "1.576"));
  kb.appendChild(r3);
  const r4 = mk("kr", "");
  numEl = mk("k fn", "123", "1.7");
  spaceEl = mk("k", "스페이스", "6"); spaceEl.style.fontSize = "15px";
  r4.append(numEl, spaceEl, mk("k fn", "return", "2.6"));
  kb.appendChild(r4);
  kb.appendChild(mk("bt",
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 14a5 5 0 009 0"/><circle cx="9" cy="9.5" r=".6"/><circle cx="15" cy="9.5" r=".6"/></svg>' +
    '<svg width="18" height="24" viewBox="0 0 18 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="5" y="1" width="8" height="14" rx="4"/><path d="M1.5 11a7.5 7.5 0 0015 0M9 19v4"/></svg>'));
})();

function setShift(on){
  shiftEl.classList.toggle("on", on);
  for(const [a, b] of Object.entries(SHIFT_MAP)){ keyEls[a].textContent = on ? b : a; keyEls[a].dataset.k = on ? b : a; }
}
function setField(v){ input.value = v; field.classList.toggle("typing", v.length > 0); }
function setKb(on){ kbOn = on; phone.classList.toggle("kb-on", on); setTimeout(scrollDown, 60); setTimeout(scrollDown, 430); }
function resetKb(){
  setKb(false); setShift(false); setField("");
  document.querySelectorAll(".k.hit").forEach(e => e.classList.remove("hit"));
  sendEl.classList.remove("press");
}

// 한글 → 자판 입력 순서(자모)로 분해, 단계마다 입력창에 보일 글자 계산
const CHO = [..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"];
const JUNG = [..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const COMP_V = {"ㅘ":["ㅗ","ㅏ"],"ㅙ":["ㅗ","ㅐ"],"ㅚ":["ㅗ","ㅣ"],"ㅝ":["ㅜ","ㅓ"],"ㅞ":["ㅜ","ㅔ"],"ㅟ":["ㅜ","ㅣ"],"ㅢ":["ㅡ","ㅣ"]};
const COMP_T = {"ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],"ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],"ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"]};
const syl = (l, v, t) => String.fromCharCode(0xAC00 + (l * 21 + v) * 28 + t);

function typeSteps(text){
  const steps = []; let acc = "";
  for(const ch of text){
    const code = ch.codePointAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      const i = code - 0xAC00, L = Math.floor(i / 588), V = Math.floor((i % 588) / 28), T = i % 28;
      steps.push({ key: CHO[L], text: acc + CHO[L] });
      const jv = JUNG[V];
      if(COMP_V[jv]){
        const [a, b] = COMP_V[jv];
        steps.push({ key: a, text: acc + syl(L, JUNG.indexOf(a), 0) });
        steps.push({ key: b, text: acc + syl(L, V, 0) });
      } else steps.push({ key: jv, text: acc + syl(L, V, 0) });
      if(T){
        const jt = JONG[T];
        if(COMP_T[jt]){
          const [a, b] = COMP_T[jt];
          steps.push({ key: a, text: acc + syl(L, V, JONG.indexOf(a)) });
          steps.push({ key: b, text: acc + syl(L, V, T) });
        } else steps.push({ key: jt, text: acc + syl(L, V, T) });
      }
      acc += syl(L, V, T);
    } else {
      acc += ch; steps.push({ key: ch, text: acc });
    }
  }
  return steps;
}

async function tap(ch){
  let el, shifted = false;
  if(UNSHIFT[ch]){ shifted = true; setShift(true); await sleep(90); el = keyEls[UNSHIFT[ch]]; }
  else el = keyEls[ch] || (ch === " " ? spaceEl : numEl);
  el.classList.add("hit");
  return () => { el.classList.remove("hit"); if(shifted) setShift(false); };
}

async function typeText(text, id){
  try{ input.focus({ preventScroll: true }); }catch(e){}
  const base = CONFIG.typeSpeed ?? 70;
  for(const s of typeSteps(text)){
    if(id !== runId) return false;
    const release = await tap(s.key);
    if(id !== runId){ release(); return false; }
    setField(s.text);
    await sleep(55);
    release();
    await sleep(base * (0.6 + Math.random() * 0.8) + (s.key === " " ? 60 : 0));
  }
  return id === runId;
}

async function play(){
  const id = ++runId;
  chat.innerHTML = ""; lastRow = null; receiptEl = null; resetKb();
  await sleep(500);
  for(const m of SCRIPT){
    if(id !== runId) return;
    if(m.date){ addNote("date", m.date); await sleep(m.wait ?? 400); continue; }
    if(m.system){ addNote("system", m.system); await sleep(m.wait ?? 400); continue; }
    if(m.pause){ await sleep(m.pause); continue; }
    if(m.read){ await sleep(m.read); if(id !== runId) return; setRead(); continue; }

    const len = (m.text || "").length;
    if(m.from === "them"){
      await sleep(m.wait ?? 600);
      if(id !== runId) return;
      const t = showTyping();
      await sleep(m.typing ?? Math.min(2500, 600 + len * 120));
      if(id !== runId) { t.remove(); return; }
      t.remove();
      addBubble("them", m.text);
    } else {
      await sleep(m.wait ?? (CONFIG.keyboard ? 500 : Math.min(2200, 500 + len * 100)));
      if(id !== runId) return;
      if(CONFIG.keyboard){
        if(!kbOn){ setKb(true); await sleep(520); if(id !== runId) return; }
        if(!(await typeText(m.text, id))) return;
        await sleep(300); if(id !== runId) return;
        sendEl.classList.add("press"); await sleep(130);
        sendEl.classList.remove("press");
        if(id !== runId) return;
        setField("");
      }
      addBubble("me", m.text);
      if(CONFIG.readDelay >= 0){            // 보낼 때마다 전달됨 → 읽음
        await sleep(CONFIG.readDelay);
        if(id !== runId) return;
        setRead();
      }
    }
  }
}

// 직접 입력: Enter = 내가 보냄(파랑), Ctrl/⌘+Enter = 상대가 보냄(회색)
function submit(asThem){
  const v = input.value.trim();
  if(!v) return;
  addBubble(asThem ? "them" : "me", v);
  input.value = ""; field.classList.remove("typing");
}
input.addEventListener("input", () => field.classList.toggle("typing", input.value.length > 0));
input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) submit(e.ctrlKey || e.metaKey); });
$("sendBtn").addEventListener("click", () => submit(false));

// 프로필 클릭 → 처음부터 다시 재생
$("contact").addEventListener("click", play);

if(CONFIG.autoplay) play();
</script>

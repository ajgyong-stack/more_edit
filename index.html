<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Messages</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;color:#fff}

  /* 1280x720 (16:9) 고정 화면을 창 크기에 맞춰 자동 확대/축소 */
  #app{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;background:#000;overflow:hidden;--kbh:280px;--side:380px}
  #app.framed{border-radius:26px;box-shadow:0 0 0 10px #222,0 20px 60px rgba(0,0,0,.6)}

  /* 상태바 */
  .status{position:absolute;top:0;left:0;right:0;height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-weight:600;font-size:15px;z-index:60;pointer-events:none}
  .status .l{display:flex;gap:10px;align-items:baseline}
  .status .l small{font-size:14px;font-weight:500}
  .status .r{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
  .batt{width:28px;height:13px;border-radius:4px;border:1px solid #777;position:relative;padding:1px}
  .batt i{display:block;height:100%;width:100%;background:#fff;border-radius:2px}
  .batt:after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#777;border-radius:0 2px 2px 0}

  /* 왼쪽 대화 목록 */
  .side{position:absolute;left:0;top:0;bottom:0;width:var(--side);background:#101012;border-right:1px solid #232326;padding-top:38px;z-index:10}
  .nosb .side{display:none}
  .nosb .pane{left:0}
  .side .top{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 0;color:#2f95ff;font-size:18px}
  .side h1{font-size:34px;font-weight:700;padding:4px 22px 10px}
  .search{margin:0 16px 8px;height:38px;border-radius:12px;background:#1f1f22;color:#8e8e93;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:17px}
  .conv{position:relative;display:flex;gap:12px;padding:10px 12px;margin:2px 10px;border-radius:14px;align-items:flex-start}
  .conv.sel{background:#2c2c30}
  .udot{position:absolute;left:1px;top:50%;margin-top:-4px;width:9px;height:9px;border-radius:50%;background:#2f95ff}
  .conv .av{flex:none;width:50px;height:50px;border-radius:50%;background:linear-gradient(#9a9aa0,#6a6a70);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600}
  .conv .av.me{background:linear-gradient(#7d6ba8,#4d3f78)}
  .conv .tx{flex:1;min-width:0}
  .conv .nm{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:600}
  .conv .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .t{flex:none;color:#8e8e93;font-size:14px;font-weight:400}
  .conv .pv{color:#8e8e93;font-size:15px;line-height:1.3;min-height:20px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:2px}

  /* 오른쪽 대화 화면 */
  .pane{position:absolute;left:var(--side);right:0;top:0;bottom:0;background:#000}
  .header{position:absolute;top:0;left:0;right:0;height:112px;z-index:20;background:linear-gradient(#000 45%,rgba(0,0,0,0));padding-top:30px}
  .hbtn{position:absolute;top:42px;right:26px;width:54px;height:42px;border-radius:21px;background:rgba(40,40,44,.85);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08)}
  .contact{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(#7d6ba8,#4d3f78);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:600}
  .namepill{margin-top:-6px;background:rgba(50,50,54,.9);border-radius:16px;padding:3px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.08)}
  .namepill small{color:#999;font-size:11px}

  .chat{position:absolute;left:0;right:0;top:0;bottom:72px;overflow-y:auto;overflow-anchor:none;padding:116px 30px 0;display:flex;flex-direction:column;scrollbar-width:none;transition:bottom .38s cubic-bezier(.2,.8,.2,1)}
  .chat>*{flex-shrink:0}
  .chat::after{content:'';flex:none;height:18px}
  .chat::-webkit-scrollbar{display:none}
  .kb-on .chat{bottom:calc(var(--kbh) + 56px)}
  .date{align-self:center;text-align:center;color:#8e8e93;font-size:13px;margin:14px 0 8px;line-height:1.35}
  .date b{font-weight:600}
  .row{display:flex;margin-top:3px;animation:pop .22s ease-out}
  .row.me{justify-content:flex-end}
  .row.gap{margin-top:12px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

  .bubble{position:relative;max-width:62%;padding:10px 18px;border-radius:22px;font-size:21px;line-height:1.28;word-break:break-word;white-space:pre-wrap}
  .me .bubble{background:#2f95ff;color:#fff}
  .them .bubble{background:#262629;color:#fff}
  .tail:before,.tail:after{content:'';position:absolute;bottom:0;height:20px}
  .me .tail:before{right:-7px;width:20px;background:#2f95ff;border-bottom-left-radius:16px 14px}
  .me .tail:after{right:-26px;width:26px;background:#000;border-bottom-left-radius:10px}
  .them .tail:before{left:-7px;width:20px;background:#262629;border-bottom-right-radius:16px 14px}
  .them .tail:after{left:-26px;width:26px;background:#000;border-bottom-right-radius:10px}

  .receipt{align-self:flex-end;font-size:12px;color:#8e8e93;margin:3px 4px 0;animation:fade .35s ease-out}
  .receipt b{font-weight:600}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .system{align-self:center;text-align:center;color:#8e8e93;font-size:13px;margin:14px 0 4px;line-height:1.35}

  .dots{display:flex;gap:4px;padding:7px 2px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* 입력창 */
  .composer{position:absolute;left:0;right:0;bottom:0;padding:12px 24px 26px;display:flex;align-items:center;gap:10px;z-index:20;background:linear-gradient(rgba(0,0,0,0),#000 40%);transition:bottom .38s cubic-bezier(.2,.8,.2,1),padding .38s cubic-bezier(.2,.8,.2,1)}
  .kb-on .composer{bottom:var(--kbh);padding-bottom:10px}
  .plus{flex:none;width:42px;height:42px;border-radius:50%;background:#2a2a2d;display:flex;align-items:center;justify-content:center}
  .field{flex:1;height:44px;border-radius:22px;border:1px solid #3a3a3d;background:#0c0c0d;display:flex;align-items:center;padding:0 7px 0 18px}
  .field input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:19px;font-family:inherit;min-width:0;caret-color:#2f95ff}
  .field input::placeholder{color:#6d6d72}
  .mic,.send{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .send{background:#2f95ff;border-radius:50%;display:none;cursor:pointer;transition:transform .1s}
  .send.press{transform:scale(.8)}
  .field.typing .mic{display:none}.field.typing .send{display:flex}

  /* 아이패드 가로 키보드 (화면 전체 폭) */
  .kb{position:absolute;left:0;right:0;bottom:0;height:var(--kbh);z-index:50;background:#1c1c1e;padding:12px 10px 0;display:flex;flex-direction:column;gap:10px;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);user-select:none;pointer-events:none}
  .kb-on .kb{transform:none}
  .kr{display:flex;gap:8px}
  .k{flex:1;min-width:0;height:52px;border-radius:7px;background:#6b6b6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.45)}
  .k.fn{background:#47474a;font-size:16px}
  .k.sp{background:transparent;box-shadow:none}
  .k.hit{background:#8a8a8e}
  .k.fn.hit{background:#6b6b6e}
  .k.on{background:#fff;color:#000}
  .k.on svg{stroke:#000;fill:#000}
  .k.l.hit::after{content:attr(data-k);position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);width:150%;height:64px;border-radius:10px;background:#8a8a8e;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5}
</style>
</head>
<body>
<div id='app'>
  <div class='status'>
    <span class='l'><span id='clock'>9:14</span><small id='dateStr'></small></span>
    <span class='r'>
      <svg width='20' height='15' viewBox='0 0 20 15' fill='none' stroke='#fff' stroke-width='2' stroke-linecap='round'><path d='M2 5.5a11 11 0 0116 0M5 8.8a7 7 0 0110 0'/><circle cx='10' cy='12' r='1.3' fill='#fff'/></svg>
      <span id='batPct'>100%</span><span class='batt'><i id='batFill'></i></span>
    </span>
  </div>

  <aside class='side'>
    <div class='top'><span>편집</span>
      <svg width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='#2f95ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-6'/><path d='M18 3l3 3-9 9-4 1 1-4z'/></svg>
    </div>
    <h1>메시지</h1>
    <div class='search'><svg width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='#8e8e93' stroke-width='2' stroke-linecap='round'><circle cx='7' cy='7' r='5'/><path d='M11 11l4 4'/></svg>검색</div>
    <div id='convs'></div>
  </aside>

  <section class='pane'>
    <div class='header'>
      <div class='contact' id='contact' title='클릭하면 처음부터 다시 재생'>
        <div class='avatar' id='avatar'>김</div>
        <div class='namepill'><span id='name'>김채원</span><small>〉</small></div>
      </div>
      <div class='hbtn'>
        <svg width='30' height='22' viewBox='0 0 30 22' fill='none' stroke='#fff' stroke-width='2.2' stroke-linejoin='round'><rect x='2' y='3' width='17' height='16' rx='4'/><path d='M19 9l7-4.5v13L19 13'/></svg>
      </div>
    </div>

    <div class='chat' id='chat'></div>

    <div class='composer'>
      <div class='plus'><svg width='20' height='20' viewBox='0 0 20 20' stroke='#fff' stroke-width='2.4' stroke-linecap='round'><path d='M10 2v16M2 10h16'/></svg></div>
      <div class='field' id='field'>
        <input id='input' placeholder='iMessage' autocomplete='off' inputmode='none'>
        <span class='mic'><svg width='18' height='24' viewBox='0 0 18 24' fill='none' stroke='#6d6d72' stroke-width='2' stroke-linecap='round'><rect x='5' y='1' width='8' height='14' rx='4'/><path d='M1.5 11a7.5 7.5 0 0015 0M9 19v4'/></svg></span>
        <span class='send' id='sendBtn'><svg width='14' height='16' viewBox='0 0 14 16' fill='none' stroke='#fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M7 15V2M2 7l5-5 5 5'/></svg></span>
      </div>
    </div>
  </section>

  <div class='kb' id='kb'></div>
</div>

<script>
/* ================== ✏️ 여기만 수정하세요 ================== */
const CONFIG = {
  name: '김지우엉🥔<◡>',   // 상대방 이름
  initial: '김',            // 프로필 동그라미 글자 (비우면 이름 첫 글자)
  time: '9:14',             // 상태바 시간 (비우면 현재 시각)
  date: '11월 12일 목요일', // 상태바 날짜
  battery: '43%',           // 상태바 배터리
  sidebar: true,            // 왼쪽 대화 목록 보이기 (false 면 대화 화면만 꽉 차게)
  frame: false,             // true 면 아이패드 테두리(베젤) 표시. 화면 녹화용은 false 추천
  listTime: '오후 9:14',    // 대화 목록에 표시되는 시각
  others: [                 // 왼쪽 목록의 다른 대화들 (지워도 됨, unread:true = 파란 점)
    { name: '엄마',   text: '오늘 저녁 뭐 먹을래?', time: '오후 8:02', unread: true },
    { name: '박서연', text: '내일 수업 몇 시야?',   time: '어제' },
    { name: '스터디방', text: '자료 올렸어요!',      time: '월요일' },
  ],
  autoplay: true,           // 열자마자 자동 재생
  delivered: '전달됨',      // 보낸 직후 표시 ('' 이면 숨김)
  readText: '읽음',         // 상대가 읽었을 때 표시
  readTime: '오후 9:15',    // 읽음 옆 시각 (비우면 현재 시각 자동)
  readDelay: 1000,          // 보낸 뒤 '전달됨' → '읽음' 까지 시간(ms). -1 이면 자동 읽음 끔
  keyboard: true,           // 하단 키보드 + 타자 치는 연출 (false 면 끔)
  typeSpeed: 70,            // 자판 하나 누르는 평균 간격(ms). 작을수록 빠르게 침
};

/*  from : 'me'(파란색, 내가 보냄) | 'them'(회색, 상대가 보냄)
    text : 메시지 내용
    wait : 타자 치기 시작하기 전 대기(ms)  (them 은 입력중 '...' 뜨기 전 대기)
    typing: (them 전용) 입력중 '...' 보여주는 시간(ms)
    { date: '...' }   → 날짜/시간 구분선
    { system: '...' } → 가운데 작은 안내문
    { pause: 3500 }   → 3.5초 쉬기                                          */
const SCRIPT = [
  { date: '<b>오늘</b> 오후 9:14' },
  { from: 'me', text: '언니',                     wait: 800 },
  { from: 'me', text: '어제 술 마시고 나한테 한 말', wait: 1300 },
  { from: 'me', text: '기억 안나요?',             wait: 1300 },
  { pause: 3500 },         // 잠깐 쉬고
  { from: 'me', text: '야',                       wait: 600 },
  { from: 'me', text: '김지우',                   wait: 1000 },
  { from: 'me', text: '또 읽씹하지',              wait: 1400 },
];
/* ========================================================== */

const $ = id => document.getElementById(id);
const app = $('app'), chat = $('chat'), input = $('input'), field = $('field');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0, lastRow = null, receiptEl = null, selRef = null;

// 화면 크기에 맞춰 16:9 캔버스 확대/축소
function fit(){
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  app.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
addEventListener('resize', fit); fit();
if(CONFIG.frame) app.classList.add('framed');

// 헤더 / 상태바
$('name').textContent = CONFIG.name;
$('avatar').textContent = CONFIG.initial || [...CONFIG.name][0] || '?';
$('dateStr').textContent = CONFIG.date || '';
$('batPct').textContent = CONFIG.battery || '100%';
$('batFill').style.width = (parseInt(CONFIG.battery) || 100) + '%';
const tickClock = () => $('clock').textContent = CONFIG.time || new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false}).replace(/^24/,'0');
tickClock(); if(!CONFIG.time) setInterval(tickClock, 10000);

// 왼쪽 대화 목록
(function buildSide(){
  if(!CONFIG.sidebar){ app.classList.add('nosb'); return; }
  const list = $('convs');
  const add = (c, sel) => {
    const d = document.createElement('div'); d.className = 'conv' + (sel ? ' sel' : '');
    if(c.unread){ const u = document.createElement('i'); u.className = 'udot'; d.appendChild(u); }
    const av = document.createElement('div'); av.className = 'av' + (sel ? ' me' : '');
    av.textContent = sel ? (CONFIG.initial || [...CONFIG.name][0] || '?') : [...c.name][0];
    const tx = document.createElement('div'); tx.className = 'tx';
    const nm = document.createElement('div'); nm.className = 'nm';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = c.name;
    const t = document.createElement('span'); t.className = 't'; t.textContent = c.time || '';
    nm.append(n, t);
    const p = document.createElement('div'); p.className = 'pv'; p.textContent = c.text || '';
    tx.append(nm, p); d.append(av, tx); list.appendChild(d);
    return { p, t };
  };
  selRef = add({ name: CONFIG.name, text: '', time: '' }, true);
  (CONFIG.others || []).forEach(c => add(c, false));
})();

function updateList(text){
  if(!selRef) return;
  selRef.p.textContent = text;
  selRef.t.textContent = CONFIG.listTime || nowLabel();
}

const scrollDown = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });

function clearReceipt(){ if(receiptEl){ receiptEl.remove(); receiptEl = null; } }

function addBubble(from, text){
  const sameGroup = lastRow && lastRow.dataset.from === from;
  if(sameGroup) lastRow.querySelector('.bubble').classList.remove('tail');
  if(from === 'them') clearReceipt();
  const row = document.createElement('div');
  row.className = 'row ' + from + (sameGroup ? '' : ' gap');
  row.dataset.from = from;
  const b = document.createElement('div');
  b.className = 'bubble tail';
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  lastRow = row;
  updateList(text);
  if(from === 'me') showReceipt();
  scrollDown();
  return row;
}

function showReceipt(){
  clearReceipt();
  if(!CONFIG.delivered) return;
  receiptEl = document.createElement('div');
  receiptEl.className = 'receipt';
  receiptEl.textContent = CONFIG.delivered;
  chat.appendChild(receiptEl);
}

function nowLabel(){
  const d = new Date(), h = d.getHours();
  return (h < 12 ? '오전' : '오후') + ' ' + (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setRead(){
  if(!receiptEl) return;
  const el = receiptEl;
  el.innerHTML = '<b>' + CONFIG.readText + '</b> ' + (CONFIG.readTime || nowLabel());
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  scrollDown();
}

function addNote(cls, html){
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html.split(String.fromCharCode(10)).join('<br>');
  chat.appendChild(d); lastRow = null; scrollDown();
}

function showTyping(){
  clearReceipt();
  const sameGroup = lastRow && lastRow.dataset.from === 'them';
  const row = document.createElement('div');
  row.className = 'row them' + (sameGroup ? '' : ' gap');
  row.innerHTML = '<div class="bubble tail"><div class="dots"><i></i><i></i><i></i></div></div>';
  chat.appendChild(row); scrollDown();
  return row;
}

/* ---------- 가상 키보드 + 타자 연출 ---------- */
const sendEl = $('sendBtn');
const ROWS = ['ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ', 'ㅋㅌㅊㅍㅠㅜㅡ'];
const SHIFT_MAP = {'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};
const UNSHIFT = Object.fromEntries(Object.entries(SHIFT_MAP).map(([a, b]) => [b, a]));
const keyEls = {};
let shiftEl, spaceEl, numEl, delEl, kbOn = false;

(function buildKb(){
  const kb = $('kb');
  const mk = (cls, html, flex) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; if(flex) d.style.flex = flex; return d; };
  const key = c => { const k = mk('k l', c); k.dataset.k = c; keyEls[c] = k; return k; };
  const shiftSvg = "<svg width='22' height='20' viewBox='0 0 22 20' fill='none' stroke='#fff' stroke-width='2' stroke-linejoin='round'><path d='M11 2L2 11h5v7h8v-7h5z'/></svg>";
  const delSvg = "<svg width='28' height='20' viewBox='0 0 26 20' fill='none' stroke='#fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'><path d='M8 2h14a2 2 0 012 2v12a2 2 0 01-2 2H8L1 10z'/><path d='M12 7l6 6M18 7l-6 6'/></svg>";
  const r1 = mk('kr', '');
  [...ROWS[0]].forEach(c => r1.appendChild(key(c)));
  delEl = mk('k fn', delSvg, '1.5'); r1.appendChild(delEl);
  const r2 = mk('kr', '');
  r2.appendChild(mk('k sp', '', '0.6'));
  [...ROWS[1]].forEach(c => r2.appendChild(key(c)));
  r2.appendChild(mk('k fn', 'return', '2'));
  const r3 = mk('kr', '');
  shiftEl = mk('k fn', shiftSvg, '2.2');
  r3.appendChild(shiftEl);
  [...ROWS[2]].forEach(c => r3.appendChild(key(c)));
  r3.appendChild(mk('k fn', shiftSvg, '2.2'));
  const r4 = mk('kr', '');
  numEl = mk('k fn', '123', '1.5');
  spaceEl = mk('k', '스페이스', '6.2'); spaceEl.style.fontSize = '16px';
  r4.append(numEl, mk('k fn', '🌐', '1.2'), spaceEl, mk('k fn', '123', '1.5'), mk('k fn', '⌄', '1.4'));
  kb.append(r1, r2, r3, r4);
})();

function setShift(on){
  shiftEl.classList.toggle('on', on);
  for(const [a, b] of Object.entries(SHIFT_MAP)){ keyEls[a].textContent = on ? b : a; keyEls[a].dataset.k = on ? b : a; }
}
function setField(v){ input.value = v; field.classList.toggle('typing', v.length > 0); }
function setKb(on){ kbOn = on; app.classList.toggle('kb-on', on); setTimeout(scrollDown, 60); setTimeout(scrollDown, 430); }
function resetKb(){
  setKb(false); setShift(false); setField('');
  document.querySelectorAll('.k.hit').forEach(e => e.classList.remove('hit'));
  sendEl.classList.remove('press');
}

// 한글 → 자판 입력 순서(자모)로 분해, 단계마다 입력창에 보일 글자 계산
const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const JUNG = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const COMP_V = {'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
const COMP_T = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const syl = (l, v, t) => String.fromCharCode(0xAC00 + (l * 21 + v) * 28 + t);

function typeSteps(text){
  const steps = []; let acc = '';
  for(const ch of text){
    const code = ch.codePointAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      const i = code - 0xAC00, L = Math.floor(i / 588), V = Math.floor((i % 588) / 28), T = i % 28;
      steps.push({ key: CHO[L], text: acc + CHO[L] });
      const jv = JUNG[V];
      if(COMP_V[jv]){
        const [a, b] = COMP_V[jv];
        steps.push({ key: a, text: acc + syl(L, JUNG.indexOf(a), 0) });
        steps.push({ key: b, text: acc + syl(L, V, 0) });
      } else steps.push({ key: jv, text: acc + syl(L, V, 0) });
      if(T){
        const jt = JONG[T];
        if(COMP_T[jt]){
          const [a, b] = COMP_T[jt];
          steps.push({ key: a, text: acc + syl(L, V, JONG.indexOf(a)) });
          steps.push({ key: b, text: acc + syl(L, V, T) });
        } else steps.push({ key: jt, text: acc + syl(L, V, T) });
      }
      acc += syl(L, V, T);
    } else {
      acc += ch; steps.push({ key: ch, text: acc });
    }
  }
  return steps;
}

async function tap(ch){
  let el, shifted = false;
  if(UNSHIFT[ch]){ shifted = true; setShift(true); await sleep(90); el = keyEls[UNSHIFT[ch]]; }
  else el = keyEls[ch] || (ch === ' ' ? spaceEl : numEl);
  el.classList.add('hit');
  return () => { el.classList.remove('hit'); if(shifted) setShift(false); };
}

async function typeText(text, id){
  try{ input.focus({ preventScroll: true }); }catch(e){}
  const base = CONFIG.typeSpeed ?? 70;
  for(const s of typeSteps(text)){
    if(id !== runId) return false;
    const release = await tap(s.key);
    if(id !== runId){ release(); return false; }
    setField(s.text);
    await sleep(55);
    release();
    await sleep(base * (0.6 + Math.random() * 0.8) + (s.key === ' ' ? 60 : 0));
  }
  return id === runId;
}

/* 입력창에 쳤던 글자를 ⌫ 키로 한 글자씩(자모 단위) 지우는 연출. 말풍선은 만들지 않음 */
async function eraseText(text, id, hold){
  await sleep(hold); if(id !== runId) return false;
  const seq = typeSteps(text).map(s => s.text).slice(0, -1).reverse();
  seq.push('');
  delEl.classList.add('hit');
  for(let i = 0; i < seq.length; i++){
    if(id !== runId){ delEl.classList.remove('hit'); return false; }
    setField(seq[i]);
    await sleep(i < 4 ? 170 : Math.max(22, 65 - i * 0.7));   // 처음엔 천천히, 꾹 누르면 점점 빠르게
  }
  delEl.classList.remove('hit');
  await sleep(800);
  return id === runId;
}

/* ✏️ 대화 내용 (erase:true → 다 치고 나서 보내지 않고 지움 / hold: 다 친 뒤 멈춰 있는 시간 ms) */
const SCRIPT2 = [
  { date: '<b>오늘</b> 오후 9:14' },
  { from: 'me', text: '언니가 어제 내 첫키스 강탈해간 거 기억나요?', wait: 1200, erase: true, hold: 1800 },
];

async function play(){
  const id = ++runId;
  chat.innerHTML = ''; lastRow = null; receiptEl = null; resetKb();
  if(selRef){ selRef.p.textContent = ''; selRef.t.textContent = ''; }
  await sleep(500);
  for(const m of SCRIPT2){
    if(id !== runId) return;
    if(m.date){ addNote('date', m.date); await sleep(m.wait ?? 400); continue; }
    if(m.system){ addNote('system', m.system); await sleep(m.wait ?? 400); continue; }
    if(m.pause){ await sleep(m.pause); continue; }
    if(m.read){ await sleep(m.read); if(id !== runId) return; setRead(); continue; }

    const len = (m.text || '').length;
    if(m.from === 'them'){
      await sleep(m.wait ?? 600);
      if(id !== runId) return;
      const t = showTyping();
      await sleep(m.typing ?? Math.min(2500, 600 + len * 120));
      if(id !== runId) { t.remove(); return; }
      t.remove();
      addBubble('them', m.text);
    } else {
      await sleep(m.wait ?? (CONFIG.keyboard ? 500 : Math.min(2200, 500 + len * 100)));
      if(id !== runId) return;
      if(CONFIG.keyboard){
        if(!kbOn){ setKb(true); await sleep(520); if(id !== runId) return; }
        if(!(await typeText(m.text, id))) return;
        if(m.erase){ if(!(await eraseText(m.text, id, m.hold ?? 1200))) return; continue; }
        await sleep(300); if(id !== runId) return;
        sendEl.classList.add('press'); await sleep(130);
        sendEl.classList.remove('press');
        if(id !== runId) return;
        setField('');
      }
      addBubble('me', m.text);
      if(CONFIG.readDelay >= 0){            // 보낼 때마다 전달됨 → 읽음
        await sleep(CONFIG.readDelay);
        if(id !== runId) return;
        setRead();
      }
    }
  }
}

// 직접 입력: Enter = 내가 보냄(파랑), Ctrl/⌘+Enter = 상대가 보냄(회색)
function submit(asThem){
  const v = input.value.trim();
  if(!v) return;
  addBubble(asThem ? 'them' : 'me', v);
  input.value = ''; field.classList.remove('typing');
}
input.addEventListener('input', () => field.classList.toggle('typing', input.value.length > 0));
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) submit(e.ctrlKey || e.metaKey); });
$('sendBtn').addEventListener('click', () => submit(false));

// 프로필 클릭 → 처음부터 다시 재생
$('contact').addEventListener('click', play);

// 최신 메시지가 항상 보이도록: 내용이 바뀌거나 키보드 애니메이션이 끝날 때마다 맨 아래로 이동
const toBottom = () => { chat.scrollTop = chat.scrollHeight; };
new MutationObserver(() => {
  toBottom(); requestAnimationFrame(toBottom);
  setTimeout(toBottom, 120); setTimeout(toBottom, 450);
}).observe(chat, { childList: true, subtree: true, characterData: true });
chat.addEventListener('transitionend', toBottom);
if(window.ResizeObserver) new ResizeObserver(toBottom).observe(chat);
window.addEventListener('resize', toBottom);

if(CONFIG.autoplay) play();
</script>
